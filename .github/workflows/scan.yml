name: scan
on:
  schedule:
    # Times are UTC. Pre-market (7:30 AM Central) then every 15 min during market hours.
    - cron: "30 13 * * 1-5"
    - cron: "*/15 14-20 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: results, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m bot.scan
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      - name: Paper trade
        run: python -m bot.trade
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          AUTO_TRADE: ${{ vars.AUTO_TRADE }}
      - name: Save results
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "scan $(date -u +%FT%TZ)"
          git pull --rebase && git push
