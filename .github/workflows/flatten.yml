name: flatten
on:
  schedule:
    # Times are UTC. Extra end-of-day checks so paper positions are closed before the bell,
    # in both standard time (close 21:00 UTC) and daylight time (close 20:00 UTC).
    # The bot only closes positions when the market is within 20 minutes of closing.
    - cron: "42,50,55 19,20 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: results, cancel-in-progress: false }
jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m bot.trade --flatten
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          AUTO_TRADE: ${{ vars.AUTO_TRADE }}
      - name: Save results
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "flatten $(date -u +%FT%TZ)"
          git pull --rebase && git push
